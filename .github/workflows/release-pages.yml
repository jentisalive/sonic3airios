name: Update release pages
on:
  push:
    branches: [ios-native]
    paths:
      - 'docs/releases/**'
      - '.github/workflows/release-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  update-descriptions:
    if: github.ref == 'refs/heads/ios-native'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Update existing release titles and notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for version in 0.1.1 0.1.2 0.1.3; do
            tag="ios-v$version"
            gh release view "$tag" --json tagName >/dev/null
            gh release edit "$tag" \
              --title "Sonic 3 A.I.R. for iOS · v$version (Experimental)" \
              --notes-file "docs/releases/$tag.md"
          done
